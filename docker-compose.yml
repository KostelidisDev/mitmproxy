name: mitmproxy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "10"

services:
  mitmproxy:
    image: ghcr.io/mitmproxy/mitmproxy:12.3.0
    container_name: mitmproxy
    restart: always
    command:
      - "mitmweb"
      - "--web-host=0.0.0.0"
      - "--set"
      - "web_password=${MITMWEB_PASSWORD:?MITMWEB_PASSWORD is required}"
    environment:
      TZ: ${TZ:-Europe/Athens}
    ports:
      - "${MITMPROXY_PROXY_BIND:-127.0.0.1}:8880:8080"
      - "${MITMPROXY_WEB_BIND:-127.0.0.1}:8881:8081"
    volumes:
      - data:/home/mitmproxy/.mitmproxy
    networks:
      - mitmproxy
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 8081), 2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
    deploy:
      resources:
        limits:
          # noinspection ComposeUnknownValues
          cpus: "${MITMPROXY_CPU_LIMIT:-0.25}"
          # noinspection ComposeUnknownValues
          memory: "${MITMPROXY_MEMORY_LIMIT:-128M}"
        reservations:
          # noinspection ComposeUnknownValues
          cpus: "${MITMPROXY_CPU_RESERVATION:-0.1}"
          # noinspection ComposeUnknownValues
          memory: "${MITMPROXY_MEMORY_RESERVATION:-64M}"

networks:
  mitmproxy:
    name: mitmproxy

volumes:
  data:
